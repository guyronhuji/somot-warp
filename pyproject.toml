[build-system]
requires = ['setuptools>=68','wheel']
build-backend = 'setuptools.build_meta'

[project]
name='somot-warp'
version='0.2.1'
description='SOM-clustered landmark OT + residual warping (sklearn API, anchorable)'
readme='README.md'
requires-python='>=3.9'
dependencies=['numpy','scikit-learn','minisom','POT','scipy','pandas','tqdm','joblib']

[project.scripts]
somot-batch='somot_warp.cli:main'
somot-apply='somot_warp.oos_cli:main'

[tool.setuptools]
packages = ['somot_warp']
